{%extends 'layout.html'%}
{%block layout%}

<form method="POST" enctype="multipart/form-data" action="">
    {{ form.hidden_tag() }}
            <div>
             <nav>
              {%if current_user.is_authenticated%}
                <ul>
                  <li class="crt"><a href='{{url_for("main.home")}}'><button class="'but" >HOME</button></a></li>
                  <li class="crt"><a href='{{url_for("user.profile",username=current_user.username)}}'><button class="'but">PROFILE</button></a></li>
                  <li class="crt"><a href='{{url_for("user.contact",username=current_user.username)}}'><button class="'but">CONTACT</button></a></li>
                  <li class="crt"><a href=#google.com><button class="but">GOOGLE MAP</button></a></li>
                  <li class="crt"><a href="{{url_for('user.logout')}}" ><button class="but">LOG OUT</button></a></li>
                </ul>
              {%else%}
                <ul>
                  <li class="crt"><a href='{{url_for("main.home")}}'><button class="'but" >HOME</button></a></li>
                  <li class="crt"><a href='{{url_for("user.create")}}'><button class="'but">CREATE ACCOUNT</button></a></li>   
                  <li class="crt"><a href=#google.com><button class="but">GOOGLE MAP</button></a></li>
                  <li class="crt"><a href="{{url_for('user.login')}}" ><button class="but">LOG IN</button></a></li>
                </ul>
              {%endif%}
            </nav>
        </div>
    <div>
        <div>
            {{form.title.label()}}
        </div>
        <div>
            {{form.title()}}
        </div>
        <hr>
        <div>
            {{form.media.label()}}
        </div>
        <div>
            {{form.media()}}
        </div>
        <div>
            {{form.content.label()}}
        </div>
        <div>
            {{form.content(class="content_box")}}
        </div>
        <hr>
        <div type="button">
            {{form.submit()}}
        </div>
    </div>
</form>

{%endblock%}
