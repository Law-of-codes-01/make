{%extends 'layout.html'%}
{%block layout%}

    <Div>
        <li class="crt"><a href='{{url_for("post.cpost")}}'><button class="'but" type="button">CREATE POST</button></a></li>

    </Div>
    <form method="POST" enctype="multipart/form-data" action="">
        <hr>

    {% for p in post %}
        <h3>{{ p.title }}</h3>
        <div> 
            <img src="{{p.author.user_img}}" width="50">
            <a href="{{url_for('post.editpost',id=p.author.id)}}"><p>{{ p.author.username }}</p></a>
        </div>
        <h3>{{ p.title }}</h3>
        <video controls width="400">
            <source src="{{ p.media_type }}" type="video/mp4">
        </video>
        <p>{{ p.content }}</p>
    {% endfor %}
    </form>
{%endblock%}
