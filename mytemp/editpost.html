{% extends 'layout.html' %}
{% block layout %}
    <form method="post" action="">
        {{ form.hidden_tag() }}

        <div>
            {{ form.title.label() }} {{ form.title() }}
        </div>
        <div>
            {{ form.content(class="content_box") }}<br>
            {{ form.content.label() }}
        </div>
        <hr>
        <div>
            {{form.submit()}}
        </div>
    </form>

{% endblock %}
